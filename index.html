<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Invitación oficial a los 15 años de Agostina. Una noche mágica en tonos azules y celestes.">
  <meta name="theme-color" content="#061021">
  <title>Mis 15 Años — Agostina</title>

  <!-- Tipografías con carga optimizada (font-display: swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Iconos Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- Estilos del modal de la puerta y estilos principales -->
  <link rel="stylesheet" href="css/puerta-modal.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="no-scroll">

  <!-- Contenedor donde se carga dinámicamente puerta-modal.html -->
  <div id="puerta-modal-slot" data-modal-src="puerta-modal.html"></div>

  <!-- CONTENIDO PRINCIPAL DE LA INVITACIÓN (Detrás de la puerta) -->
  <div id="page-wrapper" class="page-wrapper" inert>
    <main id="main-content">
      <section id="inicio" class="hero-section">
        <div class="hero-ambient-bg" aria-hidden="true">
          <div class="ambient-orb ambient-orb--one"></div>
          <div class="ambient-orb ambient-orb--two"></div>
        </div>

        <div class="hero-container reveal-on-scroll">
          <div class="hero-badge">
            <i class="fas fa-gem" aria-hidden="true"></i>
            <span>Mis 15 Años</span>
          </div>

          <h1 class="hero-title">Agostina</h1>

          <div class="hero-ornament" aria-hidden="true">
            <span class="ornament-line"></span>
            <i class="fas fa-crown"></i>
            <span class="ornament-line"></span>
          </div>

          <p class="hero-subtitle">
            Una noche soñada está por comenzar. Este espacio irá tomando forma con todos los detalles para compartir juntos este momento inolvidable.
          </p>

          <!-- Contenedor preparado para las próximas secciones -->
          <div id="proximas-secciones" class="placeholder-card">
            <i class="fas fa-compass" aria-hidden="true"></i>
            <span>Puerta abierta y navegación habilitada — listo para sumar las siguientes secciones.</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Contenedor de notificaciones Toast accesibles -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Módulo de la puerta de entrada + Lógica principal -->
  <script src="js/puerta-modal.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
