<!-- MODAL DE LA PUERTA DE ENTRADA -->
<div id="entrance-overlay" class="entrance-overlay" role="dialog" aria-modal="true" aria-label="Bienvenida a los 15 años de Agostina">
  <div class="loading-bar-track" aria-hidden="true">
    <div id="loading-bar-fill" class="loading-bar-fill"></div>
  </div>

  <div class="doors-stage">
    <!-- Hoja Izquierda -->
    <div id="door-left" class="door-leaf door-leaf--left">
      <div class="door-surface">
        <div class="door-molding door-molding--top">
          <span class="molding-corner molding-corner--tl"></span>
          <span class="molding-corner molding-corner--tr"></span>
          <span class="molding-corner molding-corner--bl"></span>
          <span class="molding-corner molding-corner--br"></span>
        </div>
        <div class="door-molding door-molding--bottom">
          <span class="molding-corner molding-corner--tl"></span>
          <span class="molding-corner molding-corner--tr"></span>
          <span class="molding-corner molding-corner--bl"></span>
          <span class="molding-corner molding-corner--br"></span>
        </div>
        <div class="door-handle door-handle--left" aria-hidden="true">
          <span class="handle-plate"></span>
          <span class="handle-ring"></span>
        </div>

        <!-- Mitad izquierda del medallón central -->
        <div class="crest-clip crest-clip--left">
          <div class="door-crest">
            <div class="crest-outer-ring"></div>
            <div class="crest-inner-ring"></div>
            <div class="crest-roses-top" data-rose-garland="crest-top" aria-hidden="true"></div>
            <div class="crest-content">
              <span class="crest-crown"><i class="fas fa-crown" aria-hidden="true"></i></span>
              <span class="crest-number">15</span>
              <span class="crest-divider"></span>
              <span class="crest-name">Agostina</span>
            </div>
            <div class="crest-roses-bottom" data-rose-garland="crest-bottom" aria-hidden="true"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Hoja Derecha -->
    <div id="door-right" class="door-leaf door-leaf--right">
      <div class="door-surface">
        <div class="door-molding door-molding--top">
          <span class="molding-corner molding-corner--tl"></span>
          <span class="molding-corner molding-corner--tr"></span>
          <span class="molding-corner molding-corner--bl"></span>
          <span class="molding-corner molding-corner--br"></span>
        </div>
        <div class="door-molding door-molding--bottom">
          <span class="molding-corner molding-corner--tl"></span>
          <span class="molding-corner molding-corner--tr"></span>
          <span class="molding-corner molding-corner--bl"></span>
          <span class="molding-corner molding-corner--br"></span>
        </div>
        <div class="door-handle door-handle--right" aria-hidden="true">
          <span class="handle-plate"></span>
          <span class="handle-ring"></span>
        </div>

        <!-- Mitad derecha del medallón central -->
        <div class="crest-clip crest-clip--right" aria-hidden="true">
          <div class="door-crest">
            <div class="crest-outer-ring"></div>
            <div class="crest-inner-ring"></div>
            <div class="crest-roses-top" data-rose-garland="crest-top"></div>
            <div class="crest-content">
              <span class="crest-crown"><i class="fas fa-crown"></i></span>
              <span class="crest-number">15</span>
              <span class="crest-divider"></span>
              <span class="crest-name">Agostina</span>
            </div>
            <div class="crest-roses-bottom" data-rose-garland="crest-bottom"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MARCO FLORAL DE ROSAS AZULES Y CELESTES POR TODOS LOS BORDES -->
  <div class="floral-frame" aria-hidden="true">
    <div class="floral-edge floral-edge--top" data-rose-garland="top"></div>
    <div class="floral-edge floral-edge--bottom" data-rose-garland="bottom"></div>
    <div class="floral-edge floral-edge--left" data-rose-garland="left"></div>
    <div class="floral-edge floral-edge--right" data-rose-garland="right"></div>

    <div class="floral-corner floral-corner--tl" data-rose-garland="corner-tl"></div>
    <div class="floral-corner floral-corner--tr" data-rose-garland="corner-tr"></div>
    <div class="floral-corner floral-corner--bl" data-rose-garland="corner-bl"></div>
    <div class="floral-corner floral-corner--br" data-rose-garland="corner-br"></div>
  </div>

  <p id="entrance-status" class="entrance-status" aria-live="polite">
    <i class="fas fa-sparkles" aria-hidden="true"></i> Preparando la entrada...
  </p>
</div>
