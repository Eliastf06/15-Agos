<!-- Definiciones SVG reutilizables: Rosas azules, celestes, pimpollos y follaje -->
<svg class="svg-defs-modal" aria-hidden="true" width="0" height="0">
  <defs>
    <radialGradient id="grad-royal-outer" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="65%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2557"/>
    </radialGradient>
    <radialGradient id="grad-royal-inner" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>

    <radialGradient id="grad-celeste-outer" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="grad-celeste-inner" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>

    <linearGradient id="grad-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#071936"/>
    </linearGradient>

    <!-- Hoja ornamental -->
    <g id="botanical-leaf">
      <path d="M0,0 C13,-15 36,-15 52,0 C36,15 13,15 0,0 Z" fill="url(#grad-leaf)" stroke="#7dd3fc" stroke-width="0.65" stroke-opacity="0.55"/>
      <path d="M2,0 L46,0" stroke="#bae6fd" stroke-width="0.65" stroke-opacity="0.6"/>
    </g>

    <!-- Pimpollo para terminaciones suaves -->
    <g id="rose-bud">
      <path d="M-11,4 C-13,-11 0,-24 0,-24 C0,-24 13,-11 11,4 C9,13 -9,13 -11,4 Z" fill="url(#grad-celeste-inner)" stroke="#e0f2fe" stroke-width="0.75"/>
      <path d="M-12,5 C-6,13 6,13 12,5 C6,16 -6,16 -12,5 Z" fill="url(#grad-leaf)"/>
    </g>

    <!-- Rosa Azul Real completa -->
    <g id="rose-royal">
      <circle cx="0" cy="0" r="36" fill="url(#grad-royal-outer)"/>
      <path d="M-30,-11 C-38,-30 -11,-40 4,-28 C19,-40 40,-24 30,-4 C40,15 24,38 2,30 C-17,40 -38,24 -30,-11 Z" fill="url(#grad-royal-outer)" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.6"/>
      <path d="M-21,-6 C-26,-24 -4,-30 6,-19 C19,-28 30,-11 19,4 C26,19 8,28 -4,19 C-19,26 -28,11 -21,-6 Z" fill="url(#grad-royal-inner)" stroke="#93c5fd" stroke-width="0.75" stroke-opacity="0.7"/>
      <path d="M-13,-4 C-15,-16 0,-19 8,-11 C16,-15 19,0 11,8 C13,16 -2,19 -11,11 C-17,13 -17,2 -13,-4 Z" fill="#2563eb" stroke="#bfdbfe" stroke-width="0.85" stroke-opacity="0.8"/>
      <path d="M-6,-2 C-6,-10 4,-11 7,-4 C11,1 5,8 -1,7 C-7,7 -10,1 -6,-2 Z" fill="#60a5fa"/>
      <path d="M-3,-1 C-2,-5 3,-5 4,-1 C4,2 0,4 -2,2 C-4,1 -4,-1 -3,-1 Z" fill="#dbeafe"/>
    </g>

    <!-- Rosa Celeste completa -->
    <g id="rose-celeste">
      <circle cx="0" cy="0" r="34" fill="url(#grad-celeste-outer)"/>
      <path d="M-28,-9 C-36,-28 -9,-38 5,-26 C19,-36 38,-19 28,-2 C36,15 19,36 0,28 C-17,36 -36,19 -28,-9 Z" fill="url(#grad-celeste-outer)" stroke="#e0f2fe" stroke-width="0.85" stroke-opacity="0.75"/>
      <path d="M-19,-5 C-24,-21 -2,-28 7,-17 C18,-24 27,-9 17,5 C22,18 6,26 -5,17 C-17,22 -25,9 -19,-5 Z" fill="url(#grad-celeste-inner)" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.8"/>
      <path d="M-11,-3 C-13,-14 1,-17 8,-9 C14,-12 16,1 8,9 C10,15 -3,16 -10,9 C-15,10 -15,1 -11,-3 Z" fill="#7dd3fc" stroke="#ffffff" stroke-width="0.85"/>
      <path d="M-5,-2 C-5,-8 4,-8 6,-3 C8,2 4,7 -2,6 C-6,5 -7,0 -5,-2 Z" fill="#e0f2fe"/>
      <circle cx="0" cy="0" r="2.8" fill="#ffffff"/>
    </g>

    <!-- Ramillete frondoso principal (más rosas y mayor volumen) -->
    <g id="rose-cluster">
      <use href="#botanical-leaf" transform="translate(-32, 14) rotate(155) scale(1.08)"/>
      <use href="#botanical-leaf" transform="translate(30, 18) rotate(25) scale(1.08)"/>
      <use href="#botanical-leaf" transform="translate(-16, -30) rotate(-115) scale(1.05)"/>
      <use href="#botanical-leaf" transform="translate(20, -28) rotate(-55) scale(1.05)"/>
      <use href="#botanical-leaf" transform="translate(0, 34) rotate(88) scale(1.1)"/>
      <use href="#rose-royal" transform="translate(-26, 10) scale(1.02)"/>
      <use href="#rose-celeste" transform="translate(26, 12) scale(0.98)"/>
      <use href="#rose-royal" transform="translate(16, -25) scale(0.86)"/>
      <use href="#rose-celeste" transform="translate(-18, -23) scale(0.9)"/>
      <use href="#rose-royal" transform="translate(-4, 24) scale(0.82)"/>
      <use href="#rose-celeste" transform="translate(2, 2) scale(1.16)"/>
    </g>

    <!-- Ramillete terminal afilado (terminaciones limpias sin cortes) -->
    <g id="rose-cluster-end">
      <use href="#botanical-leaf" transform="translate(-18, 6) rotate(160) scale(0.92)"/>
      <use href="#botanical-leaf" transform="translate(18, 6) rotate(20) scale(0.92)"/>
      <use href="#botanical-leaf" transform="translate(0, 26) rotate(90) scale(1.02)"/>
      <use href="#rose-bud" transform="translate(0, 32) rotate(180) scale(0.98)"/>
      <use href="#rose-royal" transform="translate(-14, -4) scale(0.76)"/>
      <use href="#rose-celeste" transform="translate(14, -4) scale(0.74)"/>
      <use href="#rose-celeste" transform="translate(0, 7) scale(0.88)"/>
    </g>
  </defs>
</svg>

<!-- MODAL DE LA PUERTA DE ENTRADA -->
<div id="entrance-overlay" class="entrance-overlay" role="dialog" aria-modal="true" aria-label="Bienvenida a los 15 años de Agostina">
  <div class="loading-bar-track" aria-hidden="true">
    <div id="loading-bar-fill" class="loading-bar-fill"></div>
  </div>

  <div class="doors-stage">
    <!-- Hoja Izquierda -->
    <div id="door-left" class="door-leaf door-leaf--left">
      <div class="door-surface">
        <div class="door-molding door-molding--top">
          <span class="molding-corner molding-corner--tl"></span>
          <span class="molding-corner molding-corner--tr"></span>
          <span class="molding-corner molding-corner--bl"></span>
          <span class="molding-corner molding-corner--br"></span>
        </div>
        <div class="door-molding door-molding--bottom">
          <span class="molding-corner molding-corner--tl"></span>
          <span class="molding-corner molding-corner--tr"></span>
          <span class="molding-corner molding-corner--bl"></span>
          <span class="molding-corner molding-corner--br"></span>
        </div>
        <div class="door-handle door-handle--left" aria-hidden="true">
          <span class="handle-plate"></span>
          <span class="handle-ring"></span>
        </div>

        <!-- Mitad izquierda del medallón central -->
        <div class="crest-clip crest-clip--left">
          <div class="door-crest">
            <div class="crest-outer-ring"></div>
            <div class="crest-inner-ring"></div>
            <svg class="crest-roses-top" viewBox="0 0 240 96" aria-hidden="true">
              <use href="#botanical-leaf" transform="translate(72, 52) rotate(165) scale(0.82)"/>
              <use href="#botanical-leaf" transform="translate(168, 52) rotate(15) scale(0.82)"/>
              <use href="#rose-royal" transform="translate(86, 48) scale(0.55)"/>
              <use href="#rose-royal" transform="translate(154, 48) scale(0.55)"/>
              <use href="#rose-celeste" transform="translate(120, 38) scale(0.68)"/>
            </svg>
            <div class="crest-content">
              <span class="crest-crown"><i class="fas fa-crown" aria-hidden="true"></i></span>
              <span class="crest-number">15</span>
              <span class="crest-divider"></span>
              <span class="crest-name">Agostina</span>
            </div>
            <svg class="crest-roses-bottom" viewBox="0 0 240 86" aria-hidden="true">
              <use href="#botanical-leaf" transform="translate(80, 36) rotate(-165) scale(0.72)"/>
              <use href="#botanical-leaf" transform="translate(160, 36) rotate(-15) scale(0.72)"/>
              <use href="#rose-celeste" transform="translate(96, 38) scale(0.48)"/>
              <use href="#rose-celeste" transform="translate(144, 38) scale(0.48)"/>
              <use href="#rose-royal" transform="translate(120, 44) scale(0.56)"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Hoja Derecha -->
    <div id="door-right" class="door-leaf door-leaf--right">
      <div class="door-surface">
        <div class="door-molding door-molding--top">
          <span class="molding-corner molding-corner--tl"></span>
          <span class="molding-corner molding-corner--tr"></span>
          <span class="molding-corner molding-corner--bl"></span>
          <span class="molding-corner molding-corner--br"></span>
        </div>
        <div class="door-molding door-molding--bottom">
          <span class="molding-corner molding-corner--tl"></span>
          <span class="molding-corner molding-corner--tr"></span>
          <span class="molding-corner molding-corner--bl"></span>
          <span class="molding-corner molding-corner--br"></span>
        </div>
        <div class="door-handle door-handle--right" aria-hidden="true">
          <span class="handle-plate"></span>
          <span class="handle-ring"></span>
        </div>

        <!-- Mitad derecha del medallón central -->
        <div class="crest-clip crest-clip--right" aria-hidden="true">
          <div class="door-crest">
            <div class="crest-outer-ring"></div>
            <div class="crest-inner-ring"></div>
            <svg class="crest-roses-top" viewBox="0 0 240 96">
              <use href="#botanical-leaf" transform="translate(72, 52) rotate(165) scale(0.82)"/>
              <use href="#botanical-leaf" transform="translate(168, 52) rotate(15) scale(0.82)"/>
              <use href="#rose-royal" transform="translate(86, 48) scale(0.55)"/>
              <use href="#rose-royal" transform="translate(154, 48) scale(0.55)"/>
              <use href="#rose-celeste" transform="translate(120, 38) scale(0.68)"/>
            </svg>
            <div class="crest-content">
              <span class="crest-crown"><i class="fas fa-crown"></i></span>
              <span class="crest-number">15</span>
              <span class="crest-divider"></span>
              <span class="crest-name">Agostina</span>
            </div>
            <svg class="crest-roses-bottom" viewBox="0 0 240 86">
              <use href="#botanical-leaf" transform="translate(80, 36) rotate(-165) scale(0.72)"/>
              <use href="#botanical-leaf" transform="translate(160, 36) rotate(-15) scale(0.72)"/>
              <use href="#rose-celeste" transform="translate(96, 38) scale(0.48)"/>
              <use href="#rose-celeste" transform="translate(144, 38) scale(0.48)"/>
              <use href="#rose-royal" transform="translate(120, 44) scale(0.56)"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
